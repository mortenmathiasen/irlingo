name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.backend }}${{ matrix.sanitize && ' (sanitizers)' || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: lirc
          - backend: lirc
            sanitize: true
          - backend: pigpio
            sanitize: true
    steps:
      - uses: actions/checkout@v4

      # Debian and Ubuntu do not package the pigpio C library
      - name: Build pigpio
        if: matrix.backend == 'pigpio'
        run: |
          git clone --depth 1 --branch v79 https://github.com/joan2937/pigpio.git "$RUNNER_TEMP/pigpio"
          cd "$RUNNER_TEMP/pigpio"
          gcc -O2 -fpic -c pigpio.c command.c
          gcc -shared -pthread -o libpigpio.so pigpio.o command.o
          echo "PIGPIO_ARGS=-DPIGPIO_INCLUDE_DIR=$PWD -DPIGPIO_LIBRARY=$PWD/libpigpio.so" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DIRLINGO_GPIO_BACKEND=${{ matrix.backend }}
          -DCMAKE_C_FLAGS="-Wall ${{ matrix.sanitize && '-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer' || '' }}"
          $PIGPIO_ARGS

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Line coverage of the C code (lirc backend) and of tools/lirc2irlingo.py
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr and coverage
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet gcovr coverage
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -B build -DIRLINGO_COVERAGE=ON -DPython3_EXECUTABLE="$RUNNER_TEMP/venv/bin/python"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: C coverage
        run: |
          mkdir -p coverage
          gcovr -r . build --exclude 'components/irlingo/parson\..*' --exclude 'tests/' \
            --txt --markdown coverage/c.md --html-details coverage/c.html \
            --fail-under-line 95
          cat coverage/c.md >> "$GITHUB_STEP_SUMMARY"

      - name: Converter coverage
        run: |
          cd build
          python -m coverage combine --data-file=python.coverage python.coverage.*
          python -m coverage report --data-file=python.coverage -m --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage html --data-file=python.coverage -d ../coverage/python
          python -m coverage report --data-file=python.coverage --fail-under=95

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage

  # The gpiod backend needs libgpiod >= 2.0, which Ubuntu 24.04 does not have
  test-gpiod:
    name: Test gpiod (sanitizers)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --cap-add SYS_PTRACE  # for LeakSanitizer
    steps:
      - name: Install build tools and libgpiod
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake make gcc libc6-dev libgpiod-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DIRLINGO_GPIO_BACKEND=gpiod
          -DCMAKE_C_FLAGS="-Wall -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Cross compiled static binaries for Raspberry Pi, tested under qemu with a
  # CPU matching the oldest Pi each one supports
  rpi:
    name: Raspberry Pi ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv6
            toolchain: armv6
            compiler: gcc-arm-linux-gnueabi
            qemu: qemu-arm
            cpu: arm1176      # Pi 1, Zero, Zero W
          - arch: armv7
            toolchain: armhf
            compiler: gcc-arm-linux-gnueabihf
            qemu: qemu-arm
            cpu: cortex-a7    # Pi 2
          - arch: aarch64
            toolchain: aarch64
            compiler: gcc-aarch64-linux-gnu
            qemu: qemu-aarch64
            cpu: cortex-a53   # Pi 3, Zero 2
    steps:
      - uses: actions/checkout@v4

      - name: Install cross compiler and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler }} qemu-user

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-rpi-${{ matrix.toolchain }}.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DIRLINGO_GPIO_BACKEND=lirc
          -DIRLINGO_STATIC=ON
          -DIRLINGO_REMOTES=all
          -DIRLINGO_PACKAGE_ARCH=${{ matrix.arch }}
          -DCMAKE_CROSSCOMPILING_EMULATOR=$(command -v ${{ matrix.qemu }})

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QEMU_CPU: ${{ matrix.cpu }}
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          file build/irlingo
          cd build && cpack

      # The packages contain every remote in conf/remotes
      - name: Check the packages' remotes
        run: |
          expected=$(find conf/remotes -name '*.json' | wc -l)
          deb=$(dpkg-deb -c build/irlingo_*_${{ matrix.arch }}.deb | grep -c '/conf/remotes/.*\.json$')
          tgz=$(tar -tzf build/irlingo-*-${{ matrix.arch }}.tar.gz | grep -c '/conf/remotes/.*\.json$')
          echo "remotes: $expected in conf/remotes, $deb in the .deb, $tgz in the .tar.gz"
          test "$deb" -eq "$expected" && test "$tgz" -eq "$expected"

      - uses: actions/upload-artifact@v4
        with:
          name: irlingo-${{ matrix.arch }}
          # Only this architecture's packages: the tests also build the
          # remotes archive, which the remotes job provides
          path: |
            build/irlingo-*-${{ matrix.arch }}.tar.gz
            build/irlingo_*_${{ matrix.arch }}.deb
          if-no-files-found: error

  # All remotes, for irlingo-remotes to install from
  remotes:
    name: Remotes archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build archive
        run: |
          cmake -B build -DBUILD_TESTING=OFF
          cmake --build build --target remotes_archive
          tar -tzf build/irlingo-remotes-*.tar.gz | sed -n 's/\.json$//p' | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: irlingo-remotes
          path: build/irlingo-remotes-*.tar.gz
          if-no-files-found: error

  # The API documentation (Doxygen, as ESPHome makes it), built with the
  # code, attached to releases and, from master, published on GitHub Pages.
  # Doxygen warnings fail the build.
  docs:
    name: API documentation
    runs-on: ubuntu-24.04
    env:
      DOXYGEN_VERSION: 1.12.0
      DOXYGEN_SHA256: 3c42c3f3fb206732b503862d9c9c11978920a8214f223a3950bbf2520be5f647
    steps:
      - uses: actions/checkout@v4

      # The version ESPHome's Doxyfile is written for; Ubuntu has 1.9.8
      - name: Install Doxygen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/doxygen.tar.gz" \
            "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-$DOXYGEN_VERSION.linux.bin.tar.gz"
          echo "$DOXYGEN_SHA256  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-$DOXYGEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Build with the documentation
        run: |
          cmake -B build -DIRLINGO_DOCS=ON -DIRLINGO_GPIO_BACKEND=lirc -DBUILD_TESTING=OFF
          cmake --build build --parallel
          cmake --build build --target docs_archive

      - uses: actions/upload-artifact@v4
        with:
          name: irlingo-api-docs
          path: build/irlingo-api-docs-*.tar.gz
          if-no-files-found: error

      # The HTML for GitHub Pages, from master only (see the pages job)
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: build/docs/api-docs

  # Publish the API documentation of master on GitHub Pages:
  # https://mortenmathiasen.github.io/irlingo/
  pages:
    name: Publish API documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The Home Assistant integration: lint, its tests with Home Assistant's test
  # harness, and the zip HACS installs from releases
  homeassistant:
    name: Home Assistant integration
    runs-on: ubuntu-24.04
    env:
      PHCC_VERSION: 0.13.375
      RUFF_VERSION: 0.17.6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Home Assistant installs the infrared component's library when it loads
      # it; the tests need it beforehand, in the version Home Assistant pins
      - name: Install Home Assistant's test harness and ruff
        run: |
          pip install "pytest-homeassistant-custom-component==$PHCC_VERSION" "ruff==$RUFF_VERSION"
          manifest=$(python -c "import homeassistant, pathlib; print(pathlib.Path(homeassistant.__file__).parent / 'components/infrared/manifest.json')")
          pip install $(python -c "import json, sys; print(' '.join(json.load(open(sys.argv[1]))['requirements']))" "$manifest")

      - name: Lint
        run: |
          paths="custom_components tests/homeassistant tests/test_python_encoder.py tools/package_homeassistant.py"
          ruff check $paths
          ruff format --check $paths

      - name: Tests
        run: python -m pytest tests/homeassistant

      # Fails when custom_components/irlingo/manifest.json has another version
      - name: Package for HACS
        run: |
          version=$(sed -n '/^project(/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          python tools/package_homeassistant.py --version "$version" --out irlingo-homeassistant.zip

      - uses: actions/upload-artifact@v4
        with:
          name: irlingo-homeassistant
          path: irlingo-homeassistant.zip
          if-no-files-found: error

  # Home Assistant's own checks of the integration
  hassfest:
    name: hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: home-assistant/actions/hassfest@master

  # HACS's checks of the repository, including the icon in
  # custom_components/irlingo/brand/
  hacs:
    name: HACS
    runs-on: ubuntu-24.04
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  esphome:
    name: ESPHome
    runs-on: ubuntu-24.04
    env:
      ESPHOME_VERSION: 2026.11.0
      CLANG_TIDY_VERSION: 23.1.4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ESPHome
        run: pip install "esphome==$ESPHOME_VERSION"

      # The toolchains and frameworks ESPHome downloads for the chips
      # (ESP32 family, ESP8266, RP2040)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: esphome-${{ env.ESPHOME_VERSION }}-chips-${{ hashFiles('tests/esphome/platforms/*.yaml') }}
          restore-keys: esphome-${{ env.ESPHOME_VERSION }}-

      - name: Check and compile the component
        run: tests/esphome/check.sh --compile

      # ESPHome's clang-tidy checks, on the compilation database of the
      # build above, with the clang-tidy version ESPHome uses
      - name: Install clang-tidy
        run: pip install "clang-tidy==$CLANG_TIDY_VERSION"

      - name: clang-tidy
        run: tools/clang-tidy.py

  # The C and C++ code in ESPHome's style (.clang-format), with the
  # clang-format version ESPHome uses
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    env:
      CLANG_FORMAT_VERSION: 23.1.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install clang-format
        run: pip install "clang-format==$CLANG_FORMAT_VERSION"

      - name: Check formatting
        run: git ls-files '*.c' '*.h' '*.cpp' | xargs clang-format --dry-run --Werror

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, test-gpiod, coverage, rpi, remotes, esphome, format, docs, homeassistant, hassfest, hacs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches project version
        run: |
          version=$(sed -n '/^project(/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in CMakeLists.txt"
            exit 1
          fi

      # Only the packages, the API documentation and the Home Assistant
      # integration, not e.g. the coverage report
      - uses: actions/download-artifact@v4
        with:
          pattern: irlingo-*
          path: dist
          merge-multiple: true

      - name: Check packages
        run: |
          cd dist
          ls -l
          for f in *.tar.gz; do gzip -t "$f"; done
          for f in *.deb; do dpkg-deb --info "$f" > /dev/null; done
          test "$(ls *.deb | wc -l)" -eq 3
          test "$(ls irlingo-remotes-*.tar.gz | wc -l)" -eq 1
          test "$(ls irlingo-api-docs-*.tar.gz | wc -l)" -eq 1
          test "$(ls irlingo-homeassistant.zip | wc -l)" -eq 1

      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "irlingo ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
